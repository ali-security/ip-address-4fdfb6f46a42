name: Seal build

# Upstream CI for this package is CircleCI only (.circleci/config.yml), which has
# no GitHub Actions equivalent. This workflow mirrors that CircleCI `test` job --
# node/install-packages then ./coverage.sh, across upstream's node-version matrix
# (20, 22, 24, 25) plus 23 as our primary runtime -- and adds the packaging job
# that produces the published tarball. The codecov/upload step is dropped: it
# needs a token we do not have.

on:
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['23', '20', '22', '24', '25']
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-05-01T00:00:00.000000Z
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: ./coverage.sh

    timeout-minutes: 40
  pack:
    name: Pack the release tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-05-01T00:00:00.000000Z
      - name: Install dependencies
        run: npm ci
      # `npm pack` runs the package's own prepack hook (npm run docs && npm run
      # build), regenerating README.md and compiling dist/ -- the same sequence
      # the publisher ran, so files: ["dist"] resolves to the published contents.
      - name: Pack the package tarball
        run: npm pack
      - name: Upload the package tarball
        uses: actions/upload-artifact@v4
        with:
          name: ip-address-10.2.0-tgz
          path: ip-address-10.2.0.tgz
          if-no-files-found: error
    timeout-minutes: 40
